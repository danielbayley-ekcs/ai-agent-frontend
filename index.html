<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediaferry AI</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header>
      <h1>Mediaferry AI</h1>
    </header>
    <main role="feed" aria-live="polite" aria-busy="false">
    </main>
    <footer>
      <input id="message-input" type="text" required minlength="1" maxlength="190" autofocus autocomplete="off" autocapitalize="sentences" placeholder="Type a message…">
      <button type="submit" disabled>
        <svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="none"
          stroke="currentcolor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon lucide lucide-corner-down-left-icon lucide-corner-down-left"
          role="img"
          aria-labelledby="title">
          <title>Return</title>
          <path d="M20 4v7a4 4 0 0 1-4 4H4"/>
          <path d="m9 10-5 5 5 5"/>
        </svg>
      </button>
    </footer>
    <script type="module" src="/static/script.js">
    </script>
  </body>
</html>
